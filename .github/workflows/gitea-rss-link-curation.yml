name: Daily Gitea RSS Link Curation

on:
  schedule:
    - cron: '15 2 * * *'  # Runs daily at 2:15 AM UTC
  workflow_dispatch:

jobs:
  gitea-rss-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Gitea RSS link curator
        run: |
          python3 gitea-hosting/links/gitea-link-curator.py
      
      - name: Verify output
        run: |
          echo "✅ Gitea RSS link curation completed"
          ls -lh gitea-hosting/links/*.json 2>/dev/null | tail -3 || echo "Output files ready"
