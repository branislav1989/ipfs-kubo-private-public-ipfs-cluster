name: Daily IPFS Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  update-ipfs-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run IPFS link curator
        run: |
          python3 ipfs-hosting/links/ipfs-link-curator.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "rovo-dev-bot"
          
          if [ -n "$(git status --porcelain ipfs-hosting/links/)" ]; then
            git add ipfs-hosting/links/
            git commit -m "🔄 Daily IPFS link curation update - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} 2>/dev/null || git push
          fi
