name: IPFS Link Curation

on:
  schedule:
    - cron: '10 0 * * *'  # Runs daily at 00:10 UTC
  workflow_dispatch:

jobs:
  ipfs-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run IPFS Link Curation
        run: python3 link_curator.py --category ipfs --output ipfs_ecosystem_links.json
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ipfs_ecosystem_links.json
          git commit -m "chore: update ipfs ecosystem links" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
