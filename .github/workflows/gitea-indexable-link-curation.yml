name: Daily Gitea Indexable Link Curation

on:
  schedule:
    - cron: '30 2 * * *'  # Runs daily at 2:30 AM UTC
  workflow_dispatch:

jobs:
  gitea-indexable-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Gitea indexable link curator
        run: |
          python3 gitea-hosting/links/gitea-link-curator.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "rovo-dev-bot"
          
          if [ -n "$(git status --porcelain gitea-hosting/links/)" ]; then
            git add gitea-hosting/links/
            git commit -m "🔄 Daily Gitea indexable link curation - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push origin main || git push || true
          else
            echo "No changes to commit"
          fi
