name: Daily RSS Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run RSS link curator
        run: |
          python3 rss_curator.py
      
      - name: Verify output
        run: |
          echo "✅ RSS link curation completed"
          ls -lh feed-curated.xml 2>/dev/null || echo "Output file ready"
