name: Daily RSS Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run RSS link curator
        run: |
          python3 rss_curator.py || echo "Generating RSS links..."
          mkdir -p rss_curation/links
          ls -la rss_curation/ 2>/dev/null || true
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain rss_curation/)" ]; then
            git add rss_curation/
            git commit -m "🔄 Daily RSS link curation update - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push
          else
            echo "No changes in RSS curation"
          fi

