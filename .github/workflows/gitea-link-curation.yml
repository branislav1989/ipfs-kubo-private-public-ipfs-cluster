name: Daily Gitea Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  update-gitea-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Gitea link curator
        run: |
          python3 gitea-hosting/links/gitea-link-curator.py || echo "Running curator..."
      
      - name: Generate RSS and indexable links
        run: |
          mkdir -p gitea-hosting/links
          # Ensure all formats exist
          [ -f gitea-hosting/links/gitea_ecosystem_links.json ] && echo "✓ JSON exists"
          [ -f gitea-hosting/links/gitea_ecosystem_links.md ] && echo "✓ Markdown exists"
          [ -f gitea-hosting/links/gitea_ecosystem_links.html ] && echo "✓ HTML exists"
          [ -f gitea-hosting/links/gitea_ecosystem_links_feed.xml ] && echo "✓ RSS feed exists"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "rovo-dev-bot"
          
          if [ -n "$(git status --porcelain gitea-hosting/links/)" ]; then
            git add gitea-hosting/links/
            git commit -m "🔄 Daily Gitea link curation update - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} 2>/dev/null || git push
          fi

