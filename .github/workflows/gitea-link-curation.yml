name: Daily Gitea Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-gitea-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedgen beautifulsoup4
      
      - name: Run Gitea link curator
        run: |
          python3 gitea-hosting/links/gitea-link-curator.py || echo "Link curator script - using cached links"
      
      - name: Update link curation files
        run: |
          # Files are auto-generated by curator script
          # If script fails, we keep existing files
          if [ ! -f "gitea-hosting/links/gitea_ecosystem_links.json" ]; then
            echo "Using cached link data"
          fi
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain gitea-hosting/links/)" ]; then
            git add gitea-hosting/links/
            git commit -m "🔄 Daily Gitea link curation update - $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "No changes to commit"
          fi

