name: Gitea Link Curation

on:
  schedule:
    - cron: '0 2 * * *'  # 2:00 AM UTC daily
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4
      
      - name: Run Gitea Link Curator
        run: python3 gitea-hosting/links/gitea-link-curator.py
      
      - name: Verify output
        run: |
          if [ -f gitea-hosting/links/gitea_ecosystem_links.json ]; then
            echo "✅ Gitea ecosystem links generated"
            ls -lh gitea-hosting/links/gitea_ecosystem_links.json
          else
            echo "❌ Output file not found"
            exit 1
          fi
