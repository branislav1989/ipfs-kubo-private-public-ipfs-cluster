name: Daily Rclone Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  update-rclone-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Rclone link curator
        run: |
          python3 rclone-hosting/links/rclone-link-curator.py || echo "Running curator..."
      
      - name: Generate RSS and indexable links
        run: |
          mkdir -p rclone-hosting/links
          [ -f rclone-hosting/links/rclone_ecosystem_links.json ] && echo "✓ JSON"
          [ -f rclone-hosting/links/rclone_ecosystem_links.md ] && echo "✓ Markdown"
          [ -f rclone-hosting/links/rclone_ecosystem_links.html ] && echo "✓ HTML"
          [ -f rclone-hosting/links/rclone_ecosystem_links_feed.xml ] && echo "✓ RSS"
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "rovo-dev-bot"
          
          if [ -n "$(git status --porcelain rclone-hosting/links/)" ]; then
            git add rclone-hosting/links/
            git commit -m "🔄 Daily Rclone link curation update - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} 2>/dev/null || git push
          fi

