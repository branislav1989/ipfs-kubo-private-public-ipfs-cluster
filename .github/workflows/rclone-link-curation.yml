name: Daily Rclone Link Curation Update

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  update-rclone-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Rclone link curator
        run: |
          python3 rclone-hosting/links/rclone-link-curator.py
      
      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain rclone-hosting/links/)" ]; then
            echo "✅ Rclone ecosystem links updated successfully"
            ls -lh rclone-hosting/links/rclone_ecosystem_links.json
          else
            echo "No changes detected"
          fi
