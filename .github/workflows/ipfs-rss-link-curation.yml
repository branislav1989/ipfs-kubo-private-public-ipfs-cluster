name: Daily IPFS RSS Link Curation

on:
  schedule:
    - cron: '45 2 * * *'  # Runs daily at 2:45 AM UTC
  workflow_dispatch:

jobs:
  ipfs-rss-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run IPFS RSS link curator
        run: |
          python3 ipfs-hosting/links/ipfs-link-curator.py
      
      - name: Verify output
        run: |
          echo "✅ IPFS RSS link curation completed"
          ls -lh ipfs-hosting/links/*.json 2>/dev/null | tail -3 || echo "Output files ready"
