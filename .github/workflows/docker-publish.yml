name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: docker.io
  IMAGE_NAME_APP: ${{ secrets.DOCKER_USERNAME }}/ipfs-hosting-app
  IMAGE_NAME_SATSALE: ${{ secrets.DOCKER_USERNAME }}/ipfs-satsale

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Flask App
        id: meta-app
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME_APP }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Flask App Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./flask-app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME_APP }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME_APP }}:buildcache,mode=max

  build-and-push-satsale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for SatSale
        id: meta-satsale
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME_SATSALE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push SatSale Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./satsale
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-satsale.outputs.tags }}
          labels: ${{ steps.meta-satsale.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME_SATSALE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME_SATSALE }}:buildcache,mode=max

  test-deployment:
    runs-on: ubuntu-latest
    needs: [build-and-push-app, build-and-push-satsale]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "DB_PASS=test_password_123" > .env

      - name: Test docker-compose
        run: |
          docker-compose config
          echo "✅ docker-compose.yml is valid"

      - name: Start services
        run: |
          docker-compose up -d
          sleep 30

      - name: Check service health
        run: |
          docker-compose ps
          curl -f http://localhost:5003/ || exit 1
          echo "✅ Flask app is responding"

      - name: Stop services
        run: docker-compose down -v
