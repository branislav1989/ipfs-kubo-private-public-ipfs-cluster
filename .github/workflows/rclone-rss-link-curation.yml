name: Daily Rclone RSS Link Curation

on:
  schedule:
    - cron: '15 3 * * *'  # Runs daily at 3:15 AM UTC
  workflow_dispatch:

jobs:
  rclone-rss-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Rclone RSS link curator
        run: |
          python3 rclone-hosting/links/rclone-link-curator.py
      
      - name: Verify output
        run: |
          echo "✅ Rclone RSS link curation completed"
          ls -lh rclone-hosting/links/*.json 2>/dev/null | tail -3 || echo "Output files ready"
