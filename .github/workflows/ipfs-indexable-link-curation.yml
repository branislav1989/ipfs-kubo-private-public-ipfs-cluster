name: Daily IPFS Indexable Link Curation

on:
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 3:00 AM UTC
  workflow_dispatch:

jobs:
  ipfs-indexable-curation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run IPFS indexable link curator
        run: |
          python3 ipfs-hosting/links/ipfs-link-curator.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "rovo-dev-bot"
          
          if [ -n "$(git status --porcelain ipfs-hosting/links/)" ]; then
            git add ipfs-hosting/links/
            git commit -m "🔄 Daily IPFS indexable link curation - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push origin main || git push || true
          else
            echo "No changes to commit"
          fi
